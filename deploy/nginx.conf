# nginx inside Docker. Traffic arrives from Cloudflare Tunnel (cloudflared container) or,
# if you chose proxied DNS instead, from Cloudflare's edge. Either way the visitor's real IP
# is in CF-Connecting-IP; we only trust it from Docker's private network or Cloudflare ranges.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
# Cloudflare ranges (used only with proxied DNS; keep updated from https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# "api" resolves to every API replica at startup (restart nginx after changing API_REPLICAS).
upstream api { server api:4000; keepalive 64; }
upstream web { server web:3000; keepalive 32; }

server {
  listen 80 default_server;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;

  # Same host header for both sites: the app routes yourdomain.com vs admin.yourdomain.com itself.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  location = /api/orders/stream {
    # Live order updates (Server-Sent Events): no buffering, long-lived.
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_read_timeout 120s;
  }

  location /_next/static/ {
    proxy_pass http://web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://web;
  }
}
